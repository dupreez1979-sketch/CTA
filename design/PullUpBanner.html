    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 24px 16px 40px;
    box-sizing: border-box;
  }
  .fit { position: relative; }
  .caption {
    font-family: var(--body);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #cdd6db;
    text-align: center;
    max-width: 520px;
    line-height: 1.7;
  }
  .caption b { color: #fff; }

  /* -------- the banner: true finished size 850 x 2000 mm -------- */
  .banner {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: top left;
    width: 850mm;
    height: 2000mm;
    background: var(--sky);
    overflow: hidden;
    font-family: var(--body);
    color: var(--ink);
  }

  /* cream base rising into the sky via the scalloped cloud */
  .base {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 470mm;
    background: var(--cream);
  }
  .cloud {
    position: absolute;
    left: 0;
    width: 100%;
    bottom: 470mm;
    display: block;
  }

  /* decorative puzzle shapes (several bleed off the edges on purpose) */
  .shape { position: absolute; }

  /* logo card — echoes the email header */
  .card {
    position: absolute;
    top: 150mm;
    left: 95mm;
    width: 660mm;
    box-sizing: border-box;
    padding: 52mm 56mm;
    background: var(--cream-warm);
    border: 2.4mm solid var(--ink);
    border-radius: 30mm;
    box-shadow: 13mm 13mm 0 var(--ink);
  }
  .card img { display: block; width: 100%; height: auto; }

  /* hero tagline */
  .hero {
    position: absolute;
    top: 660mm;
    left: 55mm;
    width: 740mm;
    text-align: center;
  }
  .hero h1 {
    margin: 0;
    font-family: var(--disp);
    text-transform: uppercase;
    font-size: 128mm;
    line-height: 0.92;
    letter-spacing: 0.005em;
    color: var(--ink);
    text-wrap: balance;
  }
  .hero p {
    margin: 34mm auto 0;
    max-width: 660mm;
    font-family: var(--body);
    font-weight: 600;
    font-size: 27mm;
    line-height: 1.32;
    color: var(--ink);
  }

  /* footer inside the cream base */
  .footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 165mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40mm;
  }
  .pill {
    font-family: var(--body);
    font-weight: 700;
    font-size: 30mm;
    letter-spacing: 0.01em;
    color: var(--ink);
    background: var(--yellow);
    border: 2.2mm solid var(--ink);
    border-radius: 22mm;
    box-shadow: 8mm 8mm 0 var(--ink);
    padding: 15mm 34mm;
  }
  .footer .ncti { display: block; width: 320mm; height: auto; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* Print: render one page at true 850 x 2000 mm, no screen chrome. */
  @media print {
    @page { size: 850mm 2000mm; margin: 0; }
    html, body { background: #fff; }
    .stage { background: #fff; padding: 0; gap: 0; display: block; min-height: 0; }
    .caption { display: none; }
    .fit { position: static; width: auto !important; height: auto !important; }
    .banner { position: relative; transform: none !important; }
  }
</style>
